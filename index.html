<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regalo por aniversario</title>
    <link rel="stylesheet" href="stylesheet/style.css">
</head>
<body>
   <div class="envelope-grid">

    <!-- ESTRUCTURA DEL SOBRE 1 -->
    <div class="envelope-wrapper">
      <input type="checkbox" id="envelope-1" class="envelope-toggle">
      <label for="envelope-1" class="envelope">
        
        <!-- Carta con la foto dentro -->
        <div class="letter">
          <img src="img/fotos/1ft.jpeg" alt="Recuerdo 1">
          <p>Un mensaje bonito aquí...</p>
        </div>

        <!-- Solapas que forman el sobre -->
        <div class="flap top-flap"></div>
        <div class="flap left-flap"></div>
        <div class="flap right-flap"></div>
        <div class="flap bottom-flap"></div>

        <!-- Pegatina / Sello con foto -->
        <div class="sticker">
          <img src="img/sellos/perro.png" alt="Sello 1">
        </div>

        <span class="envelope-number">25-10</span>
      </label>
    </div>
